<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iGate Model 3D</title>
<style>
  :root{--line:#d6dee6;--ink:#1d2733;--muted:#5d6b7a;--accent:#1f6fd1}
  html,body{margin:0;height:100%;overflow:hidden;background:#eef2f6;font:13px/1.4 "Segoe UI",Tahoma,"Noto Sans Thai",system-ui,sans-serif;color:var(--ink)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  iframe.off{visibility:hidden;pointer-events:none}
  #switch{position:fixed;top:12px;right:12px;z-index:5;display:flex;align-items:center;gap:8px;
    background:#ffffffee;border:1px solid var(--line);border-radius:10px;padding:6px 8px;box-shadow:0 6px 24px #0002;backdrop-filter:blur(6px)}
  #switch .t{color:var(--muted);font-size:11.5px;padding:0 2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{font:inherit;border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff}
  .seg svg{display:block}
  @media (max-width:600px){#switch{top:auto;bottom:12px;right:50%;transform:translateX(50%)}#switch .t{display:none}}
</style>
</head>
<body>
<div id="switch" role="group" aria-label="เลือกโมเดล">
  <span class="t">โมเดล</span>
  <div class="seg">
    <button data-m="loop" title="รางรูปตัว U หักมุม 90° (1.0 × 1.8 m)">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h13v8H2"/></svg>รางเลี้ยว (U)
    </button>
    <button data-m="straight" title="รางตรง 3.2 m + Q-Control + รายละเอียดประตู">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 7h16"/></svg>รางตรง
    </button>
  </div>
</div>
<script>
  // ส่ง query string (เช่น ?ws=ws://host:port) ต่อให้ทั้งสองโมเดล
  const qs = location.search;
  const SRC = {loop:'igate_model.html', straight:'igate_model_straight.html'};
  const frames = {};
  function show(m){
    if(!SRC[m]) m='straight';
    if(!frames[m]){                       // โหลดครั้งแรกเมื่อถูกเลือก แล้วเก็บไว้ (state ไม่หาย)
      const f=document.createElement('iframe'); f.src=SRC[m]+qs; f.title='iGate '+m; f.allow='fullscreen';
      document.body.insertBefore(f,document.getElementById('switch')); frames[m]=f;
    }
    for(const k in frames) frames[k].classList.toggle('off',k!==m);
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    if(location.hash!=='#'+m) history.replaceState(null,'','#'+m);
    try{localStorage.setItem('igate.model',m);}catch(e){}
    frames[m].focus();
  }
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>show(b.dataset.m));
  addEventListener('hashchange',()=>show(location.hash.slice(1)));
  let start=location.hash.slice(1);
  if(!SRC[start]){try{start=localStorage.getItem('igate.model');}catch(e){}}
  show(start||'straight');
  // API ของโมเดลที่แสดงอยู่: window.iGateTwin  / ระบุโมเดล: iGateModels.loop|straight
  Object.defineProperty(window,'iGateTwin',{get(){const m=document.querySelector('.seg button.on').dataset.m;return frames[m]?.contentWindow?.iGateTwin;}});
  window.iGateModels={get loop(){return frames.loop?.contentWindow?.iGateTwin;},get straight(){return frames.straight?.contentWindow?.iGateTwin;},show};
</script>
</body>
</html>
